<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    {% load static %}
    <link rel="icon" href="{% static "img/film_icon.ico" %}">
    <title>Our Movies</title>
    <link href="{% static "boostrap4.6.2/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Custom styles for this template -->
    <style>
        /* Blue theme, shared by every page in the movies app */
        :root {
          --mv-bg: #0b1a2c;
          --mv-surface: #1e3a5f;
          --mv-surface-dark: #13263f;
          --mv-input: #0f2035;
          --mv-border: #2c5282;
          --mv-border-input: #3a5f8a;
          --mv-text: #eef4fb;
          --mv-muted: #b4c8e0;
          --mv-placeholder: #7f9bbd;
          --mv-link: #8ec5ff;
          --mv-accent: #3b82f6;
          --mv-focus: rgba(59, 130, 246, 0.35);
        }
        body {
          padding-bottom: 2rem;
          background-color: var(--mv-bg);
          color: var(--mv-text);
        }
        a {
          color: var(--mv-link);
        }
        a:hover {
          color: #c2dfff;
        }
        .text-muted {
          color: var(--mv-muted) !important;
        }
        code {
          color: #a8d4ff;
        }
        h3 {
          margin-top: 2rem;
        }
        .jumbotron {
          position:relative;
          overflow:hidden;
          background-color: var(--mv-surface-dark);
        }
        .jumbotron .container {
          position:relative;
          z-index:2;
          background:rgba(11, 26, 44, 0.55);
          padding:2rem;
          border:1px solid var(--mv-border);
          border-radius:3px;
        }
        .jumbotron-heading a {
          color: var(--mv-text);
          text-decoration: none;
        }
        .jumbotron-background {
          object-fit:cover;
          font-family: 'object-fit: cover;';
          position:absolute;
          top:0;
          z-index:1;
          width:100%;
          height:100%;
          opacity:0.35;
        }
        img.blur {
          -webkit-filter: blur(2px);
          filter: blur(2px);
          filter:progid:DXImageTransform.Microsoft.Blur(PixelRadius='2');
        }
        p.year{
          margin-bottom: 0;
        }
        .row {
          margin-bottom: 1rem;
        }
        .row .row {
          margin-top: 1rem;
          margin-bottom: 0;
        }
        [class*="col-"] {
          padding-top: 1rem;
          padding-bottom: 1rem;
          background-color: rgba(30, 58, 95, 0.45);
          border: 1px solid rgba(44, 82, 130, 0.6);
        }
        hr {
          margin-top: 2rem;
          margin-bottom: 2rem;
          border-top-color: rgba(180, 200, 224, 0.25);
        }
        .breadcrumb {
          background-color: var(--mv-surface-dark);
          border: 1px solid var(--mv-border);
        }
        .breadcrumb-item,
        .breadcrumb-item.active,
        .breadcrumb-item + .breadcrumb-item::before {
          color: var(--mv-muted);
        }
        .card {
          background-color: var(--mv-surface);
          border-color: var(--mv-border);
          color: var(--mv-text);
        }
        .card-header,
        .card-footer {
          background-color: var(--mv-surface-dark);
          border-color: var(--mv-border);
        }
        .card-custom{
          height: 380px;
        }
        .card-title{
          max-width: 100%;
          margin-bottom: 0px;
        }
        .custom-card-body{
          padding-bottom: 0px;
          flex: none;
        }
        .formats{
          padding-top: 0px;
        }
        .list-group-item {
          background-color: var(--mv-surface);
          border-color: var(--mv-border);
          color: var(--mv-text);
        }
        .form-control,
        .form-control:focus {
          background-color: var(--mv-input);
          border-color: var(--mv-border-input);
          color: #f8f9fa;
        }
        .form-control:focus {
          border-color: var(--mv-accent);
          box-shadow: 0 0 0 0.2rem var(--mv-focus);
        }
        .form-control::placeholder {
          color: var(--mv-placeholder);
        }
        .custom-control-input:not(:checked) ~ .custom-control-label::before {
          background-color: var(--mv-input);
          border-color: var(--mv-placeholder);
        }
        .custom-control-input:checked ~ .custom-control-label::before {
          background-color: var(--mv-accent);
          border-color: var(--mv-accent);
        }
        .custom-control-input:focus ~ .custom-control-label::before {
          box-shadow: 0 0 0 0.2rem var(--mv-focus);
        }
        .site-nav {
          background-color: var(--mv-surface-dark);
          border-bottom: 1px solid var(--mv-border);
        }
        .site-nav a {
          color: var(--mv-text);
        }
        .search{
          margin-bottom:10px;
        }
        .genre_button, .filter_button{
          margin-top:10px;
        }
        @media (max-width: 1200px) {

        }
        @media (max-width: 1000px) {

        }
        @media (max-width: 800px) {
          .card-body{
            padding: 0.25rem;
          }
          .search_button{
            margin-left: 5px;
          }
          .jumbotron .container {
            padding: 0;
          }
          .form-control {
            width: 50%;
          }
        }
        @media (max-width: 400px) {
          .card-body{
            padding: 0.25rem;
          }
        }
    </style>
  </head>
  <body>
    <div class="container">
      {% include "movies_admin.html" %}
      {% include "upper.html" %}
      {% block content %}{% endblock %}
      <div class="text-center my-3">
        <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">
          <img src="{% static "img/tmdb_logo.svg" %}" alt="The Movie Database (TMDB)"
               style="width:200px">
        </a>
        <p class="small text-muted mt-2 mb-0">
          This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>
      </div>
    </div>
    <script src="{% static "js/jquery3.5.1/jquery.slim.min.js"%}"></script>
    <script src="{% static "js/popper1.16.1/popper.min.js"%}"></script>
    <script src="{% static "boostrap4.6.2/bootstrap.min.js"%}"></script>
  </body>
</html>
